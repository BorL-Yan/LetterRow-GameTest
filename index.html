<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LetterRow</title>
    <meta name="theme-color" content="#20628f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LetterRow">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="TemplateData/icons/favicon.png">
    <link rel="apple-touch-icon" href="TemplateData/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="1080" height="2400" tabindex="-1"></canvas>
    </div>

    <div id="loading">
      <img id="loading-icon" src="TemplateData/icons/icon-192.png" alt="">
      <div id="loading-title">LetterRow</div>
      <div id="progress"><div id="progress-fill"></div></div>
      <div id="loading-text">Загрузка… 0%</div>
      <div id="loading-version"></div>
    </div>

    <div id="toolbar">
      <button id="btn-install" type="button" hidden>Добавить на экран</button>
      <button id="btn-fullscreen" type="button" hidden aria-label="Во весь экран">⛶</button>
    </div>
    <div id="ios-hint" hidden>
      Чтобы добавить иконку: кнопка <b>«Поделиться»</b> → <b>«На экран „Домой“»</b>
      <button type="button" id="ios-hint-close" aria-label="Закрыть">✕</button>
    </div>
    <div id="info" hidden></div>
    <div id="unity-warning"></div>

    <script>
      // Filled in by Tools → Build → WebGL → GitHub Pages. A manual build keeps the placeholder.
      var BUILD_STAMP = "20261118-221557";
      var stamped = BUILD_STAMP.indexOf("__") !== 0;
      var query = new URLSearchParams(location.search);

      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                     (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
      var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                  (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
      var isStandalone = window.matchMedia("(display-mode: fullscreen)").matches ||
                         window.matchMedia("(display-mode: standalone)").matches ||
                         navigator.standalone === true;
      document.body.classList.toggle("mobile", isMobile);

      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var progressFill = document.querySelector("#progress-fill");
      var loadingText = document.querySelector("#loading-text");
      var warningBanner = document.querySelector("#unity-warning");
      document.querySelector("#loading-version").textContent =
        "версия " + "1.0" + (stamped ? " · сборка " + BUILD_STAMP : "");

      // A newer build was pushed while this page sat in the browser cache: reload onto it.
      function checkForNewBuild() {
        if (!stamped) return Promise.resolve();
        return fetch("version.json?t=" + Date.now(), { cache: "no-store" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (v) {
            // The guard on ?v stops a reload loop if the server still hands out the old page.
            if (v && v.build && v.build !== BUILD_STAMP && query.get("v") !== v.build) {
              var next = new URLSearchParams(query);
              next.set("v", v.build);
              location.replace(location.pathname + "?" + next.toString());
              return new Promise(function () {}); // stop here, the page is leaving
            }
          })
          .catch(function () {});
      }

      function unityShowBanner(msg, type) {
        var div = document.createElement("div");
        div.textContent = msg;
        div.className = type || "info";
        warningBanner.appendChild(div);
        if (type !== "error") setTimeout(function () { div.remove(); }, 5000);
      }

      var buildUrl = "Build";
      var v = stamped ? "?v=" + BUILD_STAMP : "";

      // Level analytics → Firebase (Assets/Scripts/Analytics/Docs/Analytics_Firebase_Plan.md §5.5).
      // Unity talks to it through FirebaseBridge.jslib; calls made before it loads wait in a queue.
      import("./firebase-bridge.js" + v).catch(function (e) { console.warn("[Analytics] firebase-bridge.js:", e); });
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb" + v,
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb" + v,
        codeUrl: buildUrl + "/WebGL.wasm.unityweb" + v,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "LetterRow",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };
      // ?dpr=1 renders at CSS-pixel resolution (performance test); default = the screen's real pixels.
      if (query.get("dpr")) config.devicePixelRatio = parseFloat(query.get("dpr"));


      // ---- Fullscreen button (browser tab only; the home-screen app is already fullscreen) ----
      var btnFs = document.querySelector("#btn-fullscreen");
      var fsTarget = document.documentElement;
      var canFs = !isStandalone && !!(fsTarget.requestFullscreen || fsTarget.webkitRequestFullscreen);
      function updateFsButton() {
        btnFs.hidden = !canFs || !!(document.fullscreenElement || document.webkitFullscreenElement);
      }
      btnFs.addEventListener("click", function () {
        var p = (fsTarget.requestFullscreen || fsTarget.webkitRequestFullscreen).call(fsTarget);
        if (p && p.then) p.then(function () {
          if (screen.orientation && screen.orientation.lock) screen.orientation.lock("portrait").catch(function () {});
        }).catch(function () {});
      });
      document.addEventListener("fullscreenchange", updateFsButton);
      document.addEventListener("webkitfullscreenchange", updateFsButton);
      updateFsButton();

      // ---- "Add to home screen" ----
      var btnInstall = document.querySelector("#btn-install");
      var installEvent = null;
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        installEvent = e;
        btnInstall.hidden = false;
      });
      btnInstall.addEventListener("click", function () {
        if (!installEvent) return;
        installEvent.prompt();
        installEvent.userChoice.finally(function () { installEvent = null; btnInstall.hidden = true; });
      });
      window.addEventListener("appinstalled", function () { btnInstall.hidden = true; });

      var iosHint = document.querySelector("#ios-hint");
      try {
        if (isIOS && !isStandalone && !localStorage.getItem("iosHintClosed")) iosHint.hidden = false;
      } catch (e) {}
      document.querySelector("#ios-hint-close").addEventListener("click", function () {
        iosHint.hidden = true;
        try { localStorage.setItem("iosHintClosed", "1"); } catch (e) {}
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("ServiceWorker.js").catch(function () {});
        });
      }

      // ---- ?info: live render size, to check the real resolution on a phone ----
      var info = document.querySelector("#info");
      if (query.has("info")) {
        info.hidden = false;
        setInterval(function () {
          info.textContent = "render " + canvas.width + "×" + canvas.height +
            " · css " + Math.round(canvas.clientWidth) + "×" + Math.round(canvas.clientHeight) +
            " · dpr " + (config.devicePixelRatio || window.devicePixelRatio).toFixed(3) +
            " · screen " + Math.round(screen.width * window.devicePixelRatio) + "×" +
            Math.round(screen.height * window.devicePixelRatio);
        }, 500);
      }


      checkForNewBuild().then(function () {
        var script = document.createElement("script");
        script.src = buildUrl + "/WebGL.loader.js" + v;
        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            progressFill.style.width = (100 * progress) + "%";
            loadingText.textContent = "Загрузка… " + Math.round(100 * progress) + "%";
          }).then(function (unityInstance) {
            window.unityInstance = unityInstance;
            loading.classList.add("done");
            setTimeout(function () { loading.remove(); }, 400);
          }).catch(function (message) {
            loadingText.textContent = "Ошибка загрузки";
            unityShowBanner(String(message), "error");
          });
        };
        script.onerror = function () {
          loadingText.textContent = "Сборка не найдена";
          unityShowBanner("Не удалось загрузить " + script.src, "error");
        };
        document.body.appendChild(script);
      });
    </script>
  </body>
</html>
